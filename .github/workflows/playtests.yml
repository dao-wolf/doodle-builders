name: Playtests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playtests:
    name: Robot playtests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/playtest/requirements.txt

      - name: Install Playwright and Chromium
        id: install
        run: |
          pip install -r tools/playtest/requirements.txt
          playwright install --with-deps chromium

      # Both scripts start their own local server.
      - name: Game playtest (seven scenarios)
        run: python tools/playtest/playtest.py

      - name: Voice studio test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/playtest/studio_test.py

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playtest-out
          path: tools/playtest/out/
          if-no-files-found: ignore
          retention-days: 14
